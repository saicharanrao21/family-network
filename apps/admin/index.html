<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Network Admin</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f8f4ec;color:#17221d}header{padding:20px 28px;background:#234f3d;color:#fff;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:0 auto;padding:28px}.bar{display:flex;gap:10px;margin-bottom:20px}.bar input{flex:1;padding:12px;border:0;border-radius:12px}.bar button{padding:12px 18px;border:0;border-radius:12px;background:#c5a45d;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px #0000000a}.value{font-size:28px;font-weight:800}.muted{color:#718078}.section{margin-top:28px}.error{color:#a11}.list{white-space:pre-wrap;font:13px ui-monospace,monospace;max-height:360px;overflow:auto}</style></head>
<body><header><strong>Family Network Admin</strong><span>Operations Console</span></header><main><div class="bar"><input id="token" type="password" placeholder="Admin access token"><button onclick="loadAll()">Load</button></div><div id="error" class="error"></div><div id="metrics" class="grid"></div><div class="section card"><h2>Graph Health</h2><button onclick="scan()">Run graph scan</button><pre id="anomalies" class="list"></pre></div><div class="section card"><h2>Moderation</h2><pre id="reports" class="list"></pre></div><div class="section card"><h2>Audit</h2><pre id="audit" class="list"></pre></div></main>
<script>const base=location.origin.replace(/:\d+$/,'')+':3000/api/v1';const token=()=>document.getElementById('token').value;async function api(path,opt={}){const r=await fetch(base+path,{...opt,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}async function loadAll(){try{const [o,a,r,l]=await Promise.all([api('/admin/overview'),api('/admin/anomalies'),api('/admin/reports'),api('/admin/audit')]);document.getElementById('metrics').innerHTML=Object.entries(o).filter(([k])=>k!=='generatedAt').map(([k,v])=>`<div class="card"><div class="value">${v}</div><div class="muted">${k}</div></div>`).join('');document.getElementById('anomalies').textContent=JSON.stringify(a,null,2);document.getElementById('reports').textContent=JSON.stringify(r,null,2);document.getElementById('audit').textContent=JSON.stringify(l,null,2);document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}async function scan(){try{document.getElementById('anomalies').textContent=JSON.stringify(await api('/admin/anomalies/scan',{method:'POST'}),null,2);await loadAll()}catch(e){document.getElementById('error').textContent=e.message}}</script><script src="./admin.js"></script></body></html>
